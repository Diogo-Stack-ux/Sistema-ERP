services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema_gestao_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: diogo9121
      POSTGRES_DB: sistema_gestao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
